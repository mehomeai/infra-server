  auth:
    password: "ci-dummy-redis-password"
auth:
  issuer: "https://ci-dummy.invalid/"
  existingSecret: "ci-dummy-auth"
appApi:
  licenseSecret:
    existingSecret: "ci-dummy-license"
ingress:
  ui:
    host: "ci-dummy.invalid"
